name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's patch and minor updates, so GitHub
# merges them when the required checks pass. Needs "Allow auto-merge" in the
# repository settings and a branch rule on main that requires the CI check;
# without them this job fails instead of merging untested.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR"
