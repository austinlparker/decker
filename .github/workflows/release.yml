name: Release

# Releases happen on their own. Every push to main that changes the library
# (not just tests, goldens, docs or CI) is tested, tagged and published; the
# version comes from the API diff against the last tag (see
# .github/scripts/next-version.sh). The engine and the bsky module release
# apart, each when it changed: the engine as vX.Y.Z, bsky as bsky/vX.Y.Z.
# The daily run catches pushes that started no workflow, such as merges made
# with the workflow token (Dependabot auto-merges). Put [skip release] in a
# merge's title to hold it back until the next one. Running the workflow by
# hand releases now, optionally with the engine as a given version.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Engine version to release, e.g. v1.0.0 (empty: work it out from the API diff)"
        required: false

permissions:
  contents: write

# One release at a time, and never cancel one halfway; a queued run starts
# from the tags the previous one pushed.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # golang.org/x/exp has no releases; pin the commit the bump rules were
  # checked against.
  APIDIFF: golang.org/x/exp/cmd/apidiff@v0.0.0-20261005173118-76772065c9b0

jobs:
  release:
    runs-on: ubuntu-latest
    # bash -eo pipefail, so a failing script piped through tee fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Held back?
        id: hold
        run: |
          # Only the subject line: a squash merge's body carries every commit
          # message in the PR, and one that merely mentions the marker must
          # not hold the release back.
          if [ "$GITHUB_EVENT_NAME" = push ] && git log -1 --format=%s | grep -qF '[skip release]'; then
            echo "skipped: [skip release] in the head commit's title"
            echo "held=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Decide the versions
        id: next
        if: steps.hold.outputs.held != 'true'
        env:
          FORCED: ${{ inputs.version }}
          NOTES: ${{ runner.temp }}/api-changes.md
          BSKY_NOTES: ${{ runner.temp }}/bsky-api-changes.md
        run: |
          : >"$NOTES"
          : >"$BSKY_NOTES"
          go install "$APIDIFF"
          .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"
          if [ -n "$FORCED" ]; then
            if ! [[ "$FORCED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "version must look like v1.2.3 or v1.2.3-rc.1, got $FORCED"; exit 1
            fi
            printf 'version=%s\ntag=%s\n' "$FORCED" "$FORCED" >>"$GITHUB_OUTPUT"
          fi
          (cd bsky && NOTES="$BSKY_NOTES" ../.github/scripts/next-version.sh) | sed 's/^/bsky_/' | tee -a "$GITHUB_OUTPUT"

      - name: Check the tags are new
        if: steps.next.outputs.version != '' || steps.next.outputs.bsky_version != ''
        env:
          TAGS: ${{ steps.next.outputs.tag }} ${{ steps.next.outputs.bsky_tag }}
        run: |
          for tag in $TAGS; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"; exit 1
            fi
          done

      # Never publish a version whose tests fail: the goldens are the contract
      # talks in other repos rely on.
      - name: Test
        if: steps.next.outputs.version != '' || steps.next.outputs.bsky_version != ''
        run: |
          go vet ./...
          go test ./...
          cd bsky
          go vet ./...
          go test ./...

      - name: Tag
        if: steps.next.outputs.version != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      # Named tags, so GoReleaser doesn't take a bsky/ tag for the engine's.
      - uses: goreleaser/goreleaser-action@v7
        if: steps.next.outputs.version != ''
        with:
          version: "~> v2"
          args: release --clean --release-header=${{ runner.temp }}/api-changes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.next.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.next.outputs.previous }}

      # bsky's go.mod replaces the engine with ../ so the two change together,
      # but whoever imports bsky gets the engine version it requires. Build it
      # against that version, from the proxy, so a release never requires an
      # engine that's missing what it uses (or one that was never tagged).
      - name: Check bsky builds against the engine it requires
        if: steps.next.outputs.bsky_version != ''
        working-directory: bsky
        run: |
          go mod edit -dropreplace=github.com/austinlparker/decker
          GOFLAGS=-mod=mod go build ./...
          git checkout -- go.mod go.sum

      - name: Tag and release bsky
        if: steps.next.outputs.bsky_version != ''
        env:
          TAG: ${{ steps.next.outputs.bsky_tag }}
          NOTES: ${{ runner.temp }}/bsky-api-changes.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --latest=false --title "$TAG" --notes-file "$NOTES"

      # Ask the module proxy for the new versions, so `go get` and pkg.go.dev
      # see them at once instead of on first use.
      - name: Warm the module proxy
        if: steps.next.outputs.version != '' || steps.next.outputs.bsky_version != ''
        env:
          ENGINE: ${{ steps.next.outputs.version }}
          BSKY: ${{ steps.next.outputs.bsky_version }}
        # From an empty directory: inside this repo the module is the main
        # module, and go list can't ask for a version of that.
        run: |
          cd "$(mktemp -d)"
          warm() {
            for _ in 1 2 3 4 5; do
              GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "$1" && return
              sleep 15
            done
            echo "::warning::the proxy hasn't picked up $1 yet; it will on first use"
          }
          if [ -n "$ENGINE" ]; then warm "github.com/austinlparker/decker@$ENGINE"; fi
          if [ -n "$BSKY" ]; then warm "github.com/austinlparker/decker/bsky@$BSKY"; fi
